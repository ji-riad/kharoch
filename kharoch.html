<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দৈনিক খরচের হিসাব</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#0f1720; color:#e8eef5;
         font-family: "Noto Sans Bengali", system-ui, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 14px; }
  .card { background:#182330; border:1px solid #243244; border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:#9db0c6; margin:8px 0 4px; }
  input, select, button { width:100%; padding:10px; border-radius:10px; border:1px solid #2c3e54;
                          background:#0f1720; color:#e8eef5; font-size:15px; font-family:inherit; }
  button { background:#2f7df6; border:none; font-weight:600; cursor:pointer; }
  button.ghost { background:#22303f; color:#cfe0f5; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .stat { background:#0f1720; border-radius:10px; padding:10px; }
  .stat small { color:#8fa3ba; font-size:12px; }
  .stat b { display:block; font-size:19px; margin-top:3px; }
  .bar { height:10px; background:#0f1720; border-radius:6px; overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; width:0; background:#2fbf71; transition:width .3s; }
  .day { margin-top:14px; }
  .day h3 { font-size:13px; color:#9db0c6; font-weight:600; margin:0 0 6px;
            display:flex; justify-content:space-between; }
  .item { display:flex; align-items:center; gap:10px; background:#0f1720;
          border-radius:10px; padding:10px; margin-bottom:6px; }
  .item .m { flex:1; min-width:0; }
  .item .t { font-size:12px; color:#8fa3ba; }
  .item .amt { font-weight:700; white-space:nowrap; }
  .del { width:auto; background:none; border:none; color:#ff6b6b; font-size:18px; cursor:pointer; padding:0 4px; }
  .empty { color:#8fa3ba; text-align:center; padding:18px; font-size:14px; }
  .warn { color:#ffb020; } .over { color:#ff6b6b; }
</style>
</head>
<body>

<h1>💰 দৈনিক খরচের হিসাব</h1>

<div class="card">
  <label>মাস নির্বাচন করুন</label>
  <input type="month" id="month">

  <label>এই মাসের খরচের লিমিট (৳)</label>
  <div class="row">
    <input type="number" id="limit" min="0" step="1" placeholder="যেমন ২০০০০">
    <button id="saveLimit" style="flex:0 0 100px">সেভ</button>
  </div>

  <div class="stats">
    <div class="stat"><small>লিমিট</small><b id="sLimit">৳০</b></div>
    <div class="stat"><small>মোট খরচ</small><b id="sSpent">৳০</b></div>
    <div class="stat"><small>বাকি আছে</small><b id="sLeft">৳০</b></div>
    <div class="stat"><small>আজকের খরচ</small><b id="sToday">৳০</b></div>
  </div>
  <div class="bar"><div id="bar"></div></div>
  <p id="hint" style="font-size:13px;color:#8fa3ba;margin:10px 0 0"></p>
</div>

<div class="card">
  <strong style="font-size:15px">নতুন খরচ যোগ করুন</strong>
  <div class="row">
    <div>
      <label>টাকার পরিমাণ</label>
      <input type="number" id="amount" min="0" step="0.01" placeholder="০">
    </div>
        <div>
      <label>খাত (নিজে লিখুন)</label>
      <input type="text" id="cat" list="catList" autocomplete="off" placeholder="যেমন: বাজার">
      <datalist id="catList"></datalist>
    </div>
  </div>
  <label>বিবরণ (ঐচ্ছিক)</label>
  <input type="text" id="note" placeholder="যেমন: দুপুরের খাবার">
  <label>তারিখ ও সময়</label>
  <input type="datetime-local" id="when">
  <br><br>
  <button id="add">+ যোগ করুন</button>
</div>

<div class="card">
  <strong style="font-size:15px">হিস্ট্রি</strong>
  <div id="history"></div>
</div>

<div class="card row">
  <button class="ghost" id="exportBtn">ব্যাকআপ (JSON)</button>
  <button class="ghost" id="csvBtn">CSV ডাউনলোড</button>
  <button class="ghost" id="importBtn">রিস্টোর</button>
  <input type="file" id="file" accept="application/json" hidden>
</div>

<script>
const KEY = 'kharoch_v1';
const $ = id => document.getElementById(id);
let db = load();

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {limits:{}, expenses:[]}; }
  catch(e){ return {limits:{}, expenses:[]}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }

const taka = n => '৳' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2});
function nowLocal(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
const monthOf = ts => ts.slice(0,7);
const dayOf   = ts => ts.slice(0,10);
const prettyDay = d => new Date(d+'T00:00')
  .toLocaleDateString('bn-BD', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const prettyTime = ts => new Date(ts)
  .toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'});

$('month').value = nowLocal().slice(0,7);
$('when').value  = nowLocal();

$('saveLimit').onclick = () => {
  const v = parseFloat($('limit').value);
  if (isNaN(v) || v < 0) return alert('সঠিক পরিমাণ লিখুন');
  db.limits[$('month').value] = v;
  save(); render();
};

$('add').onclick = () => {
  const amt = parseFloat($('amount').value);
  if (isNaN(amt) || amt <= 0) return alert('টাকার পরিমাণ ঠিকভাবে লিখুন');
  const cat = $('cat').value.trim();
  if (!cat) return alert('কোন খাতে খরচ হলো তা লিখুন');
  const ts = $('when').value || nowLocal();
  db.expenses.push({
    id: Date.now() + '' + Math.random().toString(16).slice(2),
    amount: amt, cat: cat, note: $('note').value.trim(), ts
  });
  save();
  $('amount').value = ''; $('cat').value = ''; $('note').value = ''; $('when').value = nowLocal();
  $('month').value = monthOf(ts);
  render();
};

function del(id){
  if (!confirm('এই খরচটি মুছে ফেলবেন?')) return;
  db.expenses = db.expenses.filter(e => e.id !== id);
  save(); render();
}

$('month').onchange = render;

function render(){
  const mk = $('month').value;
  const limit = db.limits[mk] || 0;
  $('limit').value = limit || '';

  const items = db.expenses.filter(e => monthOf(e.ts) === mk)
                           .sort((a,b) => b.ts.localeCompare(a.ts));
  const spent = items.reduce((s,e) => s + e.amount, 0);
  const left  = limit - spent;
  const todayKey = nowLocal().slice(0,10);
  const today = db.expenses.filter(e => dayOf(e.ts) === todayKey)
                           .reduce((s,e) => s + e.amount, 0);

  $('sLimit').textContent = taka(limit);
  $('sSpent').textContent = taka(spent);
  $('sLeft').textContent  = taka(left);
  $('sLeft').className    = left < 0 ? 'over' : (limit && left < limit*0.2 ? 'warn' : '');
  $('sToday').textContent = taka(today);

  const pct = limit ? Math.min(100, spent/limit*100) : 0;
  $('bar').style.width = pct + '%';
  $('bar').style.background = pct >= 100 ? '#ff6b6b' : pct >= 80 ? '#ffb020' : '#2fbf71';

  const [y,m] = mk.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  const isCur = mk === todayKey.slice(0,7);
  const daysLeft = isCur ? dim - new Date().getDate() + 1 : dim;
  $('hint').textContent = !limit ? 'এই মাসের জন্য এখনো কোনো লিমিট সেট করা হয়নি।'
    : left < 0 ? `লিমিট ছাড়িয়ে গেছে ${taka(-left)} টাকা!`
    : `বাকি ${daysLeft} দিনে দৈনিক গড়ে ${taka(left/daysLeft)} খরচ করা যাবে।`;

  const cats = [...new Set(db.expenses.map(e => e.cat).filter(Boolean))].sort();
  $('catList').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');

  const h = $('history');
  h.innerHTML = '';
  if (!items.length) { h.innerHTML = '<div class="empty">এই মাসে কোনো খরচ যোগ করা হয়নি।</div>'; return; }

  const groups = {};
  items.forEach(e => (groups[dayOf(e.ts)] ||= []).push(e));

  Object.keys(groups).sort().reverse().forEach(d => {
    const total = groups[d].reduce((s,e) => s + e.amount, 0);
    const box = document.createElement('div');
    box.className = 'day';
    box.innerHTML = `<h3><span>${prettyDay(d)}</span><span>${taka(total)}</span></h3>`;
    groups[d].forEach(e => {
      const row = document.createElement('div');
      row.className = 'item';
            row.innerHTML = `<div class="m"><div>${escapeHtml(e.cat)}${e.note ? ' — ' + escapeHtml(e.note) : ''}</div>
                       <div class="t">${prettyTime(e.ts)}</div></div>
                       <div class="amt">${taka(e.amount)}</div>`;
      const b = document.createElement('button');
      b.className = 'del'; b.textContent = '🗑';
      b.onclick = () => del(e.id);
      row.appendChild(b);
      box.appendChild(row);
    });
    h.appendChild(box);
  });
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
}
$('exportBtn').onclick = () => download('kharoch-backup.json', JSON.stringify(db), 'application/json');
$('csvBtn').onclick = () => {
  const rows = [['তারিখ','সময়','খাত','বিবরণ','টাকা']].concat(
    db.expenses.sort((a,b)=>a.ts.localeCompare(b.ts))
      .map(e => [dayOf(e.ts), e.ts.slice(11), e.cat, e.note, e.amount]));
  download('kharoch.csv', '\uFEFF' + rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n'), 'text/csv');
};
$('importBtn').onclick = () => $('file').click();
$('file').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.expenses) throw 0;
      db = d; save(); render(); alert('রিস্টোর সম্পন্ন হয়েছে।');
    } catch(e){ alert('ফাইলটি সঠিক নয়।'); }
  };
  r.readAsText(f);
};

render();
</script>
</body>
</html>
